# ============================================================
# Mensagens de validacao do Spring
# ============================================================
# O Spring procura este arquivo sozinho (classpath:messages.properties).
#
# Aqui ficam apenas as mensagens que NAO da para escrever na anotacao do
# formulario, porque o erro acontece ANTES da validacao: quando o texto
# recebido nem sequer cabe no tipo do campo. E o chamado "type mismatch".
#
# Sem estas linhas, a tela mostraria o texto padrao do Spring, em ingles e
# cheio de nomes de classe - algo como
# "Failed to convert property value of type java.lang.String...".
#
# A chave pode ser geral (typeMismatch.java.time.LocalDate, vale para toda
# data do sistema) ou especifica de um campo
# (typeMismatch.usuarioForm.validadeCnh). Preferimos a geral: uma linha
# resolve todas as telas.
# ============================================================

typeMismatch.java.time.LocalDate=Informe uma data válida.
typeMismatch.java.time.LocalDateTime=Informe uma data e uma hora válidas.
# Caixa de selecao que envia um id (veiculo, centro de custo na saida do #006)
# e recebe um texto que nao e numero.
typeMismatch.java.lang.Long=Escolha uma opção da lista.
# Litros e valor do abastecimento (#007), que aceitam virgula ou ponto.
typeMismatch.java.math.BigDecimal=Informe um número válido, como 45,50.
# Quilometragem do abastecimento (#007). A chave e so deste campo para nao
# mudar a mensagem dos outros campos inteiros do sistema.
typeMismatch.abastecimentoForm.quilometragem=Informe a quilometragem em números inteiros, sem ponto nem vírgula.
