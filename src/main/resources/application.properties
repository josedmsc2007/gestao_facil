# ============================================================
# Gestao Facil - configuracao da aplicacao
# ============================================================

spring.application.name=gestao-facil

# ------------------------------------------------------------
# Configuracao local de cada integrante
# ------------------------------------------------------------
# Importa o arquivo application-local.properties da raiz do projeto, se ele
# existir. O prefixo "optional:" e o que permite o projeto subir sem ele -
# sem esse prefixo, a falta do arquivo derruba a aplicacao no arranque.
#
# Tudo que estiver la dentro SOBRESCREVE o que esta neste arquivo, porque o
# Spring trata o arquivo importado como se estivesse escrito logo abaixo da
# linha do import - e, entre dois valores para a mesma chave, vence o ultimo.
#
# E por isso que a senha real fica la (arquivo ignorado pelo Git) e aqui
# permanece so o valor de exemplo SUA_SENHA_AQUI.
# Modelo para copiar: application-local.properties.exemplo
spring.config.import=optional:file:./application-local.properties

# ------------------------------------------------------------
# Banco de dados PostgreSQL
# ------------------------------------------------------------
# O banco gestao_facil precisa existir ANTES de subir a aplicacao - foi criado
# manualmente no pgAdmin. O driver do PostgreSQL nao cria banco sozinho.
# A URL nao leva parametros extras: o PostgreSQL ja trabalha em UTF-8 e
# resolve o fuso horario pelo tipo da coluna.
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_facil
spring.datasource.username=postgres
# TROQUE pela senha do seu PostgreSQL:
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
# ddl-auto=update: o Hibernate compara as classes @Entity com as tabelas e
# cria/acrescenta o que faltar. Bom para a fase de desenvolvimento.
# Cuidado: ele NUNCA apaga coluna nem tabela que voces removerem do codigo.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate executa - ajuda muito a entender
# o que esta acontecendo e a explicar o sistema na apresentacao.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto: ensina o Hibernate a falar o SQL do PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Abrir a conexao so quando precisar (evita comportamento "magico" nas telas).
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Thymeleaf (telas)
# ------------------------------------------------------------
# cache=false: alterou o HTML, basta atualizar o navegador. Em producao vira true.
spring.thymeleaf.cache=false

# ------------------------------------------------------------
# DevTools
# ------------------------------------------------------------
# Reinicia a aplicacao sozinha quando um arquivo .java e recompilado.
spring.devtools.restart.enabled=true

# ------------------------------------------------------------
# Servidor
# ------------------------------------------------------------
server.port=8080
# Acentuacao correta nas paginas.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ------------------------------------------------------------
# Carga inicial (seed)
# ------------------------------------------------------------
# Dados da empresa e do administrador de teste. Ficam aqui, e nao "chumbados"
# no codigo Java, para que a senha possa ser trocada sem recompilar - e para
# que em producao a carga possa ser desligada com seed.habilitado=false.
seed.habilitado=true
seed.empresa.identificador=construtora-teste
seed.empresa.nome=Construtora Teste
seed.empresa.rotulo-cc-singular=Obra
seed.empresa.rotulo-cc-plural=Obras
seed.admin.login=admin
seed.admin.nome=Administrador de Teste
seed.admin.senha=admin12345

# ------------------------------------------------------------
# Anexos (#003-RF09 e RN013)
# ------------------------------------------------------------
# Pasta onde os documentos enviados sao gravados. Fica FORA do projeto de
# proposito: o que estiver em src/main/resources/static o Spring serve direto
# pela URL, sem login. Aqui, o unico caminho ate o arquivo e o endpoint de
# download, que confere o login e a empresa.
# ${user.home} e a pasta do usuario do sistema operacional (no Windows,
# C:\Users\<nome>). Em producao, apontem para uma pasta com backup.
gestao-facil.anexos.diretorio=${user.home}/gestao-facil-anexos

# Limite de upload do servidor. O padrao do Spring e 1 MB, menor que os 5 MB
# da RN012: com ele, um PDF de 2 MB seria recusado antes de chegar ao nosso
# codigo, com uma pagina de erro em ingles.
# Por isso o limite do servidor fica FOLGADO (20 MB) e quem aplica os 5 MB e o
# AnexoUsuarioService, que devolve uma mensagem em portugues. Os 20 MB so
# existem para ninguem conseguir entupir o servidor com um arquivo gigante.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
