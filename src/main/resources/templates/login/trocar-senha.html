<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir nova senha - Gestão Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/gestao-facil.css}">
</head>
<body class="tela-de-entrada">

<main class="container">
    <div class="caixa-central">

        <div class="card sombra-suave">
            <div class="card-body p-4">

                <h1 class="h4 text-center mb-1">Defina a sua senha</h1>
                <p class="text-center text-secondary mb-4">
                    Olá, <span th:text="${logado.nome}">Nome</span>. Você entrou
                    com uma senha temporária. Escolha agora uma senha só sua.
                </p>

                <form th:action="@{/trocar-senha}" th:object="${trocaSenhaForm}" method="post">

                    <div class="mb-3">
                        <label for="novaSenha" class="form-label">Nova senha</label>
                        <input type="password" id="novaSenha" th:field="*{novaSenha}"
                               class="form-control form-control-lg"
                               th:classappend="${#fields.hasErrors('novaSenha')} ? 'is-invalid'"
                               autocomplete="new-password"
                               minlength="8" required autofocus>
                        <!-- RN003: o minimo de 8 caracteres e conferido aqui e
                             no servidor. O aviso aparece antes de errar. -->
                        <div class="form-text">Use pelo menos 8 caracteres.</div>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('novaSenha')}"
                             th:errors="*{novaSenha}">Erro</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmacaoSenha" class="form-label">Repita a nova senha</label>
                        <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}"
                               class="form-control form-control-lg"
                               th:classappend="${#fields.hasErrors('confirmacaoSenha')} ? 'is-invalid'"
                               autocomplete="new-password"
                               required>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('confirmacaoSenha')}"
                             th:errors="*{confirmacaoSenha}">Erro</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Salvar e entrar
                    </button>
                </form>

                <!-- Saida de emergencia: sem isto, quem abrisse esta tela por
                     engano ficaria preso nela (o interceptor devolve para ca
                     qualquer outro endereco) sem conseguir nem sair. -->
                <form th:action="@{/logout}" method="post" class="text-center mt-3">
                    <button type="submit" class="btn btn-link text-secondary">Sair</button>
                </form>

            </div>
        </div>

    </div>
</main>

</body>
</html>
