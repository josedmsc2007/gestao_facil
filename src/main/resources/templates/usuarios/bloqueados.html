<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contas bloqueadas - Gestão Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/gestao-facil.css}">
</head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <h1 class="h4">Contas bloqueadas</h1>
    <p class="text-secondary">
        Contas fechadas por erro de senha. Elas abrem sozinhas depois de
        30 minutos — ou agora, se você liberar.
    </p>

    <!-- Mensagem de confirmacao, enviada pelo controller apos o desbloqueio. -->
    <div class="alert alert-success" role="alert" th:if="${mensagem}"
         th:text="${mensagem}">Conta liberada.</div>

    <!-- Caso comum e desejavel: ninguem bloqueado. -->
    <div class="alert alert-secondary" role="alert" th:if="${bloqueados.isEmpty()}">
        Nenhuma conta bloqueada no momento.
    </div>

    <!-- table-responsive: no celular a tabela rola de lado em vez de
         espremer as colunas ate ficarem ilegiveis. -->
    <div class="table-responsive" th:unless="${bloqueados.isEmpty()}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">Funcionário</th>
                <th scope="col">Usuário</th>
                <th scope="col">Bloqueada até</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${bloqueados}">
                <td th:text="${usuario.nome}">Nome</td>
                <td th:text="${usuario.login}">login</td>
                <td th:text="${#temporals.format(usuario.bloqueadoAte, 'dd/MM/yyyy HH:mm')}">
                    00/00/0000 00:00
                </td>
                <td class="text-end">
                    <!-- Liberar muda dados, entao e POST com token CSRF -
                       nunca um link. Um link poderia ser disparado por
                       outro site, ou por um pre-carregamento do navegador. -->
                    <form th:action="@{/usuarios/{id}/desbloquear(id=${usuario.id})}"
                          method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-primary">
                            Liberar agora
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/painel}" class="btn btn-link px-0">Voltar ao painel</a>

</main>

</body>
</html>
