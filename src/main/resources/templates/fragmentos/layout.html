<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!--
    ============================================================
    O <head> de todas as telas, num arquivo so.
    ============================================================

    O PROBLEMA QUE ISTO RESOLVE
    Ate o card #003 estas oito linhas estavam COPIADAS em cada tela. Com sete
    telas, trocar a versao do Bootstrap ou acrescentar um icone significava
    abrir sete arquivos e lembrar de todos - e basta esquecer um para o
    sistema ficar com duas aparencias diferentes.

    COMO CADA TELA USA
    No lugar do <head> inteiro, uma linha so:

        <head th:replace="~{fragmentos/layout :: cabeca('Usuários')}"></head>

    O texto entre aspas e o titulo daquela tela; o " - Gestão Fácil" e o
    resto sao acrescentados aqui. Quando o titulo e calculado pelo controller,
    passa-se a variavel: cabeca(${tituloDaTela}).

    POR QUE PARAMOS NO <head>, E NAO FIZEMOS UM "LAYOUT" COMPLETO
    Existe uma tecnica do Thymeleaf que embrulha a pagina inteira (o corpo de
    cada tela viraria um pedaco passado para ca com ~{::conteudo}). Ela
    economizaria mais duas linhas por tela - a barra do topo e a <main> - mas
    ao custo de uma sintaxe que ninguem le de primeira, e as duas telas de
    entrada (login e troca de senha) nem usariam, porque nao tem barra e tem
    fundo proprio.

    Duas linhas repetidas que qualquer um entende valem mais, neste projeto,
    do que uma abstracao que precisa ser explicada. Se um dia houver quinze
    telas com a mesma moldura, vale reabrir a discussao.
-->
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <!-- Sem esta linha o celular mostra a pagina "encolhida", como se fosse
         um computador. E ela que faz o layout responsivo funcionar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} - Gestão Fácil|">Gestão Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/gestao-facil.css}">
</head>

<body>
<!-- Este arquivo nunca e aberto direto no navegador: ele so existe para
     emprestar o <head> acima para as outras telas. -->
</body>
</html>
