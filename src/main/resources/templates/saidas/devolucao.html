<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Registrar devolução')}"></head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h1 class="h4 mb-3">Registrar devolução</h1>

            <!-- #006-RN006: mesma caixa da tela de saida, mostrada pelo
                 aviso-sem-conexao.js quando o celular esta sem internet. -->
            <div id="aviso-sem-conexao" class="alert alert-warning d-none" role="alert">
                Sem conexão com a internet. Não é possível registrar agora, e nada foi
                enviado. Quando o sinal voltar, toque no botão de novo.
            </div>

            <div class="alert alert-danger" role="alert" th:if="${erro}"
                 th:text="${erro}">Ação recusada.</div>

            <!-- O veiculo, o destino e a data de saida sao so MOSTRADOS: na
                 devolucao eles nao mudam, e o DevolucaoForm nem tem esses
                 campos. -->
            <div class="card mb-3">
                <div class="card-body">
                    <p class="text-secondary small mb-1">Veículo que está com você</p>
                    <p class="h5 mb-1" th:text="${usoEmAberto.veiculo.nome}">Veículo</p>
                    <p class="font-monospace mb-3"
                       th:text="${usoEmAberto.veiculo.placaFormatada}">ABC-1D23</p>

                    <p class="mb-1">
                        <span class="text-secondary"
                              th:text="|${logado.rotuloCcSingular}:|">Destino:</span>
                        <span th:text="${usoEmAberto.centroCusto.nome}">Nome</span>
                    </p>
                    <p class="mb-0">
                        <span class="text-secondary">Saída:</span>
                        <span th:text="${#temporals.format(usoEmAberto.dataSaida, 'dd/MM/yyyy HH:mm')}">
                            01/10/2026 07:30
                        </span>
                    </p>
                </div>
            </div>

            <form th:object="${devolucaoForm}" th:action="@{/saidas/devolucao}" method="post"
                  data-exige-conexao>

                <div class="mb-4">
                    <label for="dataDevolucao" class="form-label">Data e hora da devolução</label>
                    <input type="datetime-local" id="dataDevolucao" th:field="*{dataDevolucao}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('dataDevolucao')} ? 'is-invalid'"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dataDevolucao')}"
                         th:errors="*{dataDevolucao}">Erro</div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg py-3">
                        Registrar devolução
                    </button>
                    <a th:href="@{/lancamentos}" class="btn btn-outline-secondary btn-lg">
                        Cancelar
                    </a>
                </div>
            </form>

        </div>
    </div>

</main>

<script th:src="@{/js/aviso-sem-conexao.js}"></script>

</body>
</html>
