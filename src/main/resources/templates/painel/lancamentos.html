<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lançamentos - Gestão Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/gestao-facil.css}">
</head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <h1 class="h4">Meus lançamentos</h1>
    <p class="text-secondary">
        Olá, <strong th:text="${logado.nome}">Nome</strong>.
    </p>

    <!--
        TELA PROVISORIA, destino do perfil Motorista (RN006).

        Os botoes abaixo estao desligados de proposito: mostram o formato que
        a tela tera, com poucos elementos e area de toque grande, adequada a
        quem vai usar o sistema em pe, no canteiro de obras. As telas de
        verdade entram nos cards do RF06 e do RF07.
    -->
    <div class="d-grid gap-3 mt-4">
        <button class="btn btn-outline-primary btn-lg py-3" type="button" disabled>
            Registrar saída de veículo
        </button>
        <button class="btn btn-outline-primary btn-lg py-3" type="button" disabled>
            Registrar devolução
        </button>
        <button class="btn btn-outline-primary btn-lg py-3" type="button" disabled>
            Registrar abastecimento
        </button>
    </div>

    <p class="text-secondary small mt-4">
        Estas telas ainda estão em construção.
    </p>

</main>

</body>
</html>
