<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel - Gestão Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/gestao-facil.css}">
</head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <h1 class="h4">Painel de gestão</h1>
    <p class="text-secondary">
        Olá, <strong th:text="${logado.nome}">Nome</strong> — administrador.
    </p>

    <!-- RN005: por enquanto e a unica acao de verdade do painel. -->
    <div class="d-grid gap-2 col-md-5 mt-4">
        <a th:href="@{/usuarios/bloqueados}" class="btn btn-outline-primary btn-lg py-3">
            Contas bloqueadas
        </a>
    </div>

    <!--
        O RESTO DA TELA AINDA E PROVISORIO.

        Ela existe para o redirecionamento por perfil (RN006) ter um destino.
        Os cadastros de verdade vem nos proximos cards.

        Repare que o texto abaixo usa o rotulo da empresa, e nao a palavra
        "Obras" escrita a mao - e a regra 6 do projeto. Para a construtora
        aparece "obras"; para uma transportadora apareceria "rotas".
    -->
    <div class="alert alert-secondary mt-4" role="alert">
        Esta tela ainda está em construção. Os cadastros de veículos,
        <span th:text="${#strings.toLowerCase(logado.rotuloCcPlural)}">obras</span>
        e usuários entram nos próximos cards.
    </div>

</main>

</body>
</html>
