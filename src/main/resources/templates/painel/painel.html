<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Painel')}"></head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <h1 class="h4">Painel de gestão</h1>
    <p class="text-secondary">
        Olá, <strong th:text="${logado.nome}">Nome</strong> — administrador.
    </p>

    <!-- As acoes ja entregues. Sem este bloco nao existe caminho ate as telas:
         as rotas internas nao aparecem em lugar nenhum.

         A tela "Contas bloqueadas", que ficava aqui desde o card #001, deixou
         de existir: desbloquear virou um botao dentro da lista de usuarios
         (#003-RF06), junto com as outras acoes sobre a mesma pessoa. -->
    <div class="d-grid gap-2 col-md-5 mt-4">
        <a th:href="@{/usuarios}" class="btn btn-primary btn-lg py-3">
            Usuários
        </a>
        <a th:href="@{/veiculos}" class="btn btn-primary btn-lg py-3">
            Veículos
        </a>
        <!-- Regra 6 do projeto: o nome do botao vem do cadastro da empresa.
             Para a Construtora Teste sai "Obras"; para outra, "Rotas". -->
        <a th:href="@{/centros-de-custo}" class="btn btn-primary btn-lg py-3"
           th:text="${logado.rotuloCcPlural}">
            Obras
        </a>
    </div>

    <!--
        O RESTO DA TELA AINDA E PROVISORIO.

        Ela existe para o redirecionamento por perfil (RN006) ter um destino.
        Os cadastros de verdade vem nos proximos cards.

        Repare que o texto abaixo usa o rotulo da empresa, e nao a palavra
        "Obras" escrita a mao - e a regra 6 do projeto. Para a construtora
        aparece "obras"; para uma transportadora apareceria "rotas".
    -->
    <div class="alert alert-secondary mt-4" role="alert">
        Esta tela ainda está em construção. Os lançamentos de saída,
        abastecimento e manutenção e os relatórios entram nos próximos cards.
    </div>

</main>

</body>
</html>
