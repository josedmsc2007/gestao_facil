<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Painel')}"></head>
<body>

<nav th:replace="~{fragmentos/barra :: barra(${logado})}"></nav>

<main class="container py-4">

    <h1 class="h4">Painel de gestão</h1>
    <p class="text-secondary">
        Olá, <strong th:text="${logado.nome}">Nome</strong> — administrador.
    </p>

    <!-- Botoes para chegar nas telas que ja existem. Sem eles, dava pra acessar
         /usuarios ou /veiculos digitando o endereco na mao, mas nao tinha
         nenhum link clicavel ate aqui. -->
    <div class="d-grid gap-2 col-md-5 mt-4">
        <a th:href="@{/usuarios}" class="btn btn-primary btn-lg py-3">
            Usuários
        </a>
        <a th:href="@{/veiculos}" class="btn btn-primary btn-lg py-3">
            Veículos
        </a>
        <a th:href="@{/veiculos-em-uso}" class="btn btn-primary btn-lg py-3">
            Veículos em uso
        </a>
        <!-- O texto deste botao vem do que a propria empresa cadastrou, nao e
             fixo no codigo. Cada empresa ve o nome que escolheu. -->
        <a th:href="@{/centros-de-custo}" class="btn btn-primary btn-lg py-3"
           th:text="${logado.rotuloCcPlural}">
            Obras
        </a>
    </div>

    <!--
        O resto desta tela ainda e provisorio: ela so existe para o
        administrador ter para onde ir depois do login. As telas de verdade
        vao chegando nos proximos cards.
    -->
    <div class="alert alert-secondary mt-4" role="alert">
        Esta tela ainda está em construção. A saída e a devolução de veículos são
        registradas pelo motorista; os lançamentos de abastecimento e manutenção
        e os relatórios entram nos próximos cards.
    </div>

</main>

</body>
</html>
