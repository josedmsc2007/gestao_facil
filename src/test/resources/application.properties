# ============================================================
# Configuracao usada SOMENTE pelos testes automatizados
# ============================================================
# Este arquivo substitui o application.properties quando os testes rodam.
# Os testes usam um banco H2 em memoria, e nao o PostgreSQL, por tres motivos:
#
# 1. qualquer integrante roda "mvnw test" logo depois de clonar, sem precisar
#    do PostgreSQL no ar nem da senha em application-local.properties;
# 2. o banco de desenvolvimento nao fica sujo com as empresas e usuarios que
#    os testes inventam;
# 3. o banco nasce e morre a cada execucao, entao um teste nunca depende do
#    que outro deixou para tras.
#
# O que os testes NAO cobrem com isso e a configuracao do PostgreSQL em si -
# essa voces conferem toda vez que sobem a aplicacao com "mvnw spring-boot:run".
# ============================================================

spring.datasource.url=jdbc:h2:mem:teste;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# create-drop: cria as tabelas ao iniciar os testes e apaga no final.
spring.jpa.hibernate.ddl-auto=create-drop

# Sem o SQL no console: a saida dos testes fica legivel.
spring.jpa.show-sql=false

# A carga inicial nao roda nos testes - cada teste cria os dados de que precisa.
seed.habilitado=false

# Os anexos dos testes vao para a pasta temporaria do sistema, nunca para a
# pasta real. Os testes de anexo apagam essa pasta ao terminar.
gestao-facil.anexos.diretorio=${java.io.tmpdir}/gestao-facil-anexos-testes
